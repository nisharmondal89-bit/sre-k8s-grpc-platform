apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sre-platform-monitor
  labels:
    release: monitoring
spec:
  selector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - worker
          - gateway
  endpoints:
    - port: metrics
      interval: 15s
    - port: http
      path: /metrics
      interval: 15s
